[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gosms-python"
version = "2.1.0"
description = "Official Python SDK for GoSMS.GE SMS Gateway"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "GoSMS.GE", email = "info@gosms.ge" },
]
keywords = ["sms", "sms-api", "gosms", "sms-sdk", "sms-gateway", "otp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
async = ["httpx>=0.24.0"]
django = ["django>=3.2"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "responses>=0.23",
    "pytest-httpx>=0.21",
    "ruff>=0.1",
    "build",
]

[project.urls]
Homepage = "https://gosms.ge"
Repository = "https://github.com/gosms-ge/gosmsge-python"
Issues = "https://github.com/gosms-ge/gosmsge-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gosms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
